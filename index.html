<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Font Simplify</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in {
      animation: fadeIn 0.4s ease-out forwards;
    }
  </style>
</head>
<body class="min-h-screen bg-neutral-950 text-neutral-100 font-sans selection:bg-blue-500/30 flex flex-col justify-between">

  <!-- Header -->
  <header class="flex justify-between items-center py-5 px-8 border-b border-neutral-800/60 bg-neutral-950/70 backdrop-blur-md fixed top-0 w-full z-10">
    <div class="flex items-center space-x-2">
      <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 shadow-[0_0_10px_rgba(16,185,129,0.5)]"></span>
      <h1 class="text-lg font-bold tracking-tight text-white">Font Simplify</h1>
    </div>
    <a 
      href="https://instagram.com/Editbyujjwal" 
      target="_blank" 
      rel="noreferrer"
      class="text-sm font-medium text-neutral-400 hover:text-white transition-colors duration-200"
    >
      Editbyujjwal
    </a>
  </header>

  <!-- Main Container -->
  <main class="flex flex-col items-center justify-center flex-grow px-4 pt-28 pb-16">
    <div class="bg-neutral-900/90 border border-neutral-800/80 p-8 sm:p-10 rounded-3xl shadow-2xl max-w-lg w-full text-center relative overflow-hidden backdrop-blur-xl animate-fade-in">
      
      <div class="inline-flex items-center justify-center w-12 h-12 rounded-2xl bg-neutral-800/70 border border-neutral-700/50 mb-5 text-neutral-300">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M12 4v16m8-8H4" />
        </svg>
      </div>

      <h2 class="text-2xl font-semibold mb-2 tracking-tight">Simplify Font</h2>
      <p class="text-neutral-400 text-sm mb-8 leading-relaxed">
        Upload complex, variable, or crash-prone TTF/OTF fonts to strip variable axes and optimize them for mobile video editors.
      </p>

      <!-- Drag & Drop Zone -->
      <label 
        id="dropZone"
        class="flex flex-col items-center justify-center border-2 border-dashed border-neutral-800 hover:border-neutral-600 bg-neutral-950/40 rounded-2xl p-6 cursor-pointer transition-all duration-200 group mb-6"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8 text-neutral-500 group-hover:text-neutral-300 transition-colors mb-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
        </svg>
        <span id="fileNameDisplay" class="text-sm font-medium text-neutral-300 text-center truncate max-w-xs">
          Choose a file or drag & drop here
        </span>
        <span class="text-xs text-neutral-500 mt-1">Accepts .ttf, .otf</span>
        <input id="fontInput" type="file" accept=".ttf,.otf" class="hidden" />
      </label>

      <!-- Action Button -->
      <button 
        id="processBtn"
        class="w-full font-medium py-3.5 px-5 rounded-2xl bg-white text-neutral-950 hover:bg-neutral-200 transition-all duration-200 shadow-[0_0_25px_rgba(255,255,255,0.08)] active:scale-[0.99] disabled:opacity-50 disabled:cursor-not-allowed"
      >
        Convert & Download
      </button>

      <!-- Status Message -->
      <p id="statusMsg" class="mt-5 text-sm transition-all duration-200 min-h-[1.25rem]"></p>
    </div>
  </main>

  <!-- Footer -->
  <footer class="py-4 text-center text-xs text-neutral-500 border-t border-neutral-800/40">
    Processed client-side. Zero data sent to servers.
  </footer>

  <!-- Binary Processing Logic -->
  <script>
    const fontInput = document.getElementById('fontInput');
    const dropZone = document.getElementById('dropZone');
    const fileNameDisplay = document.getElementById('fileNameDisplay');
    const processBtn = document.getElementById('processBtn');
    const statusMsg = document.getElementById('statusMsg');

    let selectedFile = null;

    // File Selection Handlers
    fontInput.addEventListener('change', (e) => {
      if (e.target.files.length > 0) {
        selectedFile = e.target.files[0];
        fileNameDisplay.textContent = selectedFile.name;
        setStatus('');
      }
    });

    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.classList.add('border-neutral-500', 'bg-neutral-900/60');
    });

    dropZone.addEventListener('dragleave', () => {
      dropZone.classList.remove('border-neutral-500', 'bg-neutral-900/60');
    });

    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('border-neutral-500', 'bg-neutral-900/60');
      if (e.dataTransfer.files.length > 0) {
        selectedFile = e.dataTransfer.files[0];
        fileNameDisplay.textContent = selectedFile.name;
        setStatus('');
      }
    });

    function setStatus(text, type = 'info') {
      statusMsg.textContent = text;
      statusMsg.className = 'mt-5 text-sm min-h-[1.25rem] ' + 
        (type === 'success' ? 'text-emerald-400' : type === 'error' ? 'text-rose-400' : 'text-neutral-400');
    }

    // Client-side OpenType Binary Table Pruning Engine
    processBtn.addEventListener('click', async () => {
      if (!selectedFile) {
        setStatus('Please select a font file first.', 'error');
        return;
      }

      setStatus('Reading and processing font binary...');
      processBtn.disabled = true;

      try {
        const buffer = await selectedFile.arrayBuffer();
        const simplifiedBlob = stripVariableTables(buffer);

        const downloadUrl = URL.createObjectURL(simplifiedBlob);
        const a = document.createElement('a');
        a.href = downloadUrl;
        a.download = 'Simplified_' + selectedFile.name;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(downloadUrl);

        setStatus('Font simplified successfully! Downloaded.', 'success');
      } catch (err) {
        setStatus(err.message || 'Error parsing font binary.', 'error');
      } finally {
        processBtn.disabled = false;
      }
    });

    function stripVariableTables(arrayBuffer) {
      const view = new DataView(arrayBuffer);
      const sfntVersion = view.getUint32(0);
      const numTables = view.getUint16(4);

      // Verify OpenType / TrueType signature (0x00010000 or 'OTTO' or 'true')
      if (sfntVersion !== 0x00010000 && sfntVersion !== 0x4F54544F && sfntVersion !== 0x74727565) {
        throw new Error('Unsupported font format. Provide a valid .ttf or .otf file.');
      }

      // Variable & problematic font tables to eliminate for mobile editors
      const blacklistedTags = new Set([
        'STAT', 'fvar', 'gvar', 'cvar', 'MVAR', 'avar', 'HVAR', 'VVAR', 'VORG'
      ]);

      const tables = [];
      let offset = 12;

      for (let i = 0; i < numTables; i++) {
        let tag = '';
        for (let j = 0; j < 4; j++) {
          tag += String.fromCharCode(view.getUint8(offset + j));
        }
        const checksum = view.getUint32(offset + 4);
        const tableOffset = view.getUint32(offset + 8);
        const length = view.getUint32(offset + 12);

        if (!blacklistedTags.has(tag)) {
          // Copy binary chunk of preserved table
          const data = new Uint8Array(arrayBuffer, tableOffset, length);
          tables.push({ tag, checksum, length, data });
        }
        offset += 16;
      }

      // Sort tables alphabetically as required by OpenType specification
      tables.sort((a, b) => a.tag.localeCompare(b.tag));

      // Calculate Header search parameters
      const newNumTables = tables.length;
      let maxPower = 1;
      while (maxPower * 2 <= newNumTables) {
        maxPower *= 2;
      }
      const searchRange = maxPower * 16;
      const entrySelector = Math.log2(maxPower);
      const rangeShift = newNumTables * 16 - searchRange;

      // Calculate new file size with 4-byte padding alignment
      let currentOffset = 12 + newNumTables * 16;
      for (const t of tables) {
        t.newOffset = currentOffset;
        currentOffset += (t.length + 3) & ~3; // Align to 4-byte boundary
      }

      const outBuffer = new ArrayBuffer(currentOffset);
      const outView = new DataView(outBuffer);
      const outBytes = new Uint8Array(outBuffer);

      // Write Offset Table (Header)
      outView.setUint32(0, sfntVersion);
      outView.setUint16(4, newNumTables);
      outView.setUint16(6, searchRange);
      outView.setUint16(8, entrySelector);
      outView.setUint16(10, rangeShift);

      // Write Table Directory & Payload
      let recordOffset = 12;
      for (const t of tables) {
        for (let j = 0; j < 4; j++) {
          outView.setUint8(recordOffset + j, t.tag.charCodeAt(j));
        }
        outView.setUint32(recordOffset + 4, t.checksum);
        outView.setUint32(recordOffset + 8, t.newOffset);
        outView.setUint32(recordOffset + 12, t.length);

        // Copy table bytes
        outBytes.set(t.data, t.newOffset);

        recordOffset += 16;
      }

      return new Blob([outBuffer], { type: 'font/ttf' });
    }
  </script>
</body>
</html>
